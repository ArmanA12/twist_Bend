<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Twist Band</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --accent: #1A1A1A;
    --bg-1: #F3F3F3; --bg-2: #E9E9E9; --bg-3: #DEDEDE;
    --ink: #1A1A1A;
    --btn: #3A3A3A; --btn-hover: #111; --btn-ink: #fff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 40%, var(--bg-1) 0%, var(--bg-2) 60%, var(--bg-3) 100%);
    font-family: Inter, Helvetica, Arial, sans-serif;
    color: var(--ink);
    overflow: hidden;
    user-select: none;
  }
  button { font: inherit; color: inherit; }

  /* Corner labels */
  .corner { position: fixed; z-index: 10; display: flex; align-items: center; gap: 10px;
    font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; pointer-events: none; }
  .corner.tl { top: 32px; left: 40px; }
  .corner.tr { top: 26px; right: 40px; pointer-events: auto; }
  .corner.bl { bottom: 34px; left: 40px; }
  .corner.br { bottom: 34px; right: 40px; }
  .bullet { width: 5px; height: 5px; border-radius: 50%; background: var(--ink); }
  .icon-btn { margin-left: 8px; width: 38px; height: 38px; border-radius: 10px; background: var(--btn); color: var(--btn-ink);
    border: 0; display: grid; place-items: center; cursor: pointer; transition: background .2s; }
  .icon-btn:hover { background: var(--btn-hover); }
  .icon-btn .i-play, .icon-btn[aria-pressed="true"] .i-pause { display: none; }
  .icon-btn[aria-pressed="true"] .i-play { display: block; }
  .num { display: inline-block; min-width: 2ch; font-variant-numeric: tabular-nums; }

  /* Logo: a twisted-band mark and a tracked wordmark, with a quiet subline. */
  .brand { gap: 12px; letter-spacing: 0; text-transform: none; }
  .brand .mark { width: 30px; height: 30px; flex: none; color: var(--ink); }
  .brand .words { display: flex; flex-direction: column; gap: 4px; line-height: 1; }
  .brand .wm { font-size: 12px; font-weight: 800; letter-spacing: .32em; text-transform: uppercase; }
  .brand .wm sup { font-size: 7px; font-weight: 500; letter-spacing: 0; margin-left: 2px; vertical-align: 5px; opacity: .6; }
  .brand .sub { font-size: 9px; font-weight: 500; letter-spacing: .26em; text-transform: uppercase; opacity: .45; }

  /* Counter: an editorial index — small label, large light numerals, the total, and a hairline progress rule. */
  .counter { gap: 14px; align-items: center; }
  .counter .icon-btn { margin-left: 4px; width: 42px; height: 42px; border-radius: 50%;
    box-shadow: 0 8px 22px -10px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.14); }

  /* Stage */
  #stage { position: fixed; inset: 0; cursor: grab; touch-action: none; }
  #stage.dragging { cursor: grabbing; }
  #stage canvas { display: block; width: 100%; height: 100%; opacity: 0; transition: opacity .5s ease; }
  #stage.ready canvas { opacity: 1; }
  #stage.ready.swapping canvas { opacity: 0; transition-duration: .22s; }

  /* Dock: previous / current shade / next / library */
  .dock { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 10;
    display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 999px;
    background: color-mix(in srgb, var(--bg-1) 55%, transparent);
    border: 1px solid color-mix(in srgb, var(--ink) 10%, transparent);
    box-shadow: 0 18px 40px -22px rgba(0,0,0,.45), inset 0 1px 0 color-mix(in srgb, #fff 18%, transparent);
    backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2); }
  .dock .nav { width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; cursor: pointer;
    display: grid; place-items: center; opacity: .7; transition: opacity .2s, background .2s; }
  .dock .nav:hover { opacity: 1; background: color-mix(in srgb, var(--ink) 9%, transparent); }
  .now { display: flex; align-items: center; gap: 9px; min-width: 230px; justify-content: center; padding: 0 6px;
    font-size: 10px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
  .now .name { font-weight: 800; letter-spacing: .12em; }
  .now .cat { opacity: .5; }
  .now .of { opacity: .45; }
  .swatch { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(127,127,127,.35); }
  .lib-btn { height: 32px; padding: 0 14px 0 11px; border: 0; border-radius: 999px; cursor: pointer;
    display: flex; align-items: center; gap: 8px; background: var(--btn); color: var(--btn-ink);
    font-size: 10px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; transition: background .2s; }
  .lib-btn:hover { background: var(--btn-hover); }

  /* Library overlay */
  .library { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column;
    background: color-mix(in srgb, var(--bg-2) 86%, transparent);
    backdrop-filter: blur(22px) saturate(1.1); -webkit-backdrop-filter: blur(22px) saturate(1.1);
    opacity: 0; visibility: hidden; transition: opacity .3s ease, visibility 0s linear .3s; }
  .library.open { opacity: 1; visibility: visible; transition: opacity .3s ease; }
  .corner, .dock { transition: opacity .3s ease; }
  body.lib-open .corner, body.lib-open .dock { opacity: 0; pointer-events: none; }
  .lib-head { display: grid; grid-template-columns: 1fr auto auto; align-items: end; gap: 18px 22px; padding: 34px 44px 14px; }
  .lib-title { display: flex; flex-direction: column; gap: 8px; font-size: 40px; font-weight: 300; letter-spacing: -.035em; line-height: .9; }
  .lib-title span { font-size: 10px; font-weight: 500; letter-spacing: .26em; text-transform: uppercase; opacity: .5; }
  /* Filter: one scrolling row of chips, each with its count, fading out at the edges. */
  .chips { grid-column: 1 / -1; display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 40px), transparent);
            mask-image: linear-gradient(90deg, transparent, #000 24px, #000 calc(100% - 40px), transparent); }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; height: 32px; padding: 0 12px 0 15px; border-radius: 999px; display: flex; align-items: center; gap: 8px;
    border: 1px solid color-mix(in srgb, var(--ink) 14%, transparent); background: color-mix(in srgb, var(--ink) 3%, transparent);
    cursor: pointer; font-size: 10px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap;
    transition: background .25s, color .25s, border-color .25s, transform .25s; }
  .chip b { font-weight: 600; font-size: 9px; letter-spacing: .04em; padding: 2px 6px; border-radius: 999px; min-width: 20px; text-align: center;
    background: color-mix(in srgb, var(--ink) 9%, transparent); font-variant-numeric: tabular-nums; }
  .chip:hover { border-color: color-mix(in srgb, var(--ink) 40%, transparent); transform: translateY(-1px); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg-1); border-color: var(--ink); box-shadow: 0 10px 22px -12px rgba(0,0,0,.55); }
  .chip[aria-pressed="true"] b { background: color-mix(in srgb, var(--bg-1) 22%, transparent); }
  .chip.empty { opacity: .35; }
  .search { position: relative; width: 340px; grid-row: 1; grid-column: 2; }
  .lib-head .lib-close { grid-row: 1; grid-column: 3; }
  .search input { width: 100%; height: 44px; padding: 0 74px 0 44px; border-radius: 14px; font: inherit; font-size: 13px; letter-spacing: .01em;
    color: var(--ink); background: color-mix(in srgb, var(--bg-1) 70%, transparent);
    border: 1px solid color-mix(in srgb, var(--ink) 12%, transparent); outline: none;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.06), 0 14px 30px -24px rgba(0,0,0,.55);
    transition: border-color .25s, box-shadow .25s, background .25s; }
  .search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; display: none; }
  .search input::placeholder { color: color-mix(in srgb, var(--ink) 42%, transparent); }
  .search input:focus { border-color: color-mix(in srgb, var(--accent) 70%, transparent); background: color-mix(in srgb, var(--bg-1) 92%, transparent);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent), 0 18px 34px -22px rgba(0,0,0,.6); }
  .search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); opacity: .5; pointer-events: none; }
  .search kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font: 600 10px Inter, sans-serif; padding: 3px 7px;
    border-radius: 6px; border: 1px solid color-mix(in srgb, var(--ink) 16%, transparent); opacity: .5; pointer-events: none; }
  .search .clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; border-radius: 50%; border: 0;
    background: color-mix(in srgb, var(--ink) 10%, transparent); color: var(--ink); cursor: pointer; font-size: 14px; line-height: 1; display: none; }
  .search.has-text .clear { display: block; }
  .search.has-text kbd { display: none; }
  .search .clear:hover { background: color-mix(in srgb, var(--ink) 18%, transparent); }
  .no-results { grid-column: 1 / -1; padding: 90px 0; text-align: center; font-size: 22px; font-weight: 300; letter-spacing: -.01em; opacity: .55; }
  .no-results small { display: block; margin-top: 10px; font-size: 10px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; opacity: .7; }
  .lib-close { height: 44px; padding: 0 20px; border-radius: 14px; border: 0; cursor: pointer;
    background: var(--btn); color: var(--btn-ink); font-size: 10px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; }
  .grid { flex: 1; overflow-y: auto; padding: 6px 40px 40px; display: grid; gap: 22px 18px;
    grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); align-content: start; }
  .tile { border: 0; background: transparent; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 10px; }
  .tile[hidden] { display: none; }
  .thumb { position: relative; aspect-ratio: 16 / 10; border-radius: 14px; overflow: hidden;
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 10%, transparent);
    transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .25s; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .4s ease; }
  .thumb img.loaded { opacity: 1; }
  .thumb .shimmer { position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.18) 50%, transparent 70%);
    background-size: 220% 100%; animation: shimmer 1.4s linear infinite; }
  @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
  .tile:hover .thumb { transform: translateY(-3px); box-shadow: 0 0 0 1px color-mix(in srgb, var(--ink) 30%, transparent); }
  .tile[aria-current="true"] .thumb { box-shadow: 0 0 0 2px var(--ink); }
  .meta { display: flex; align-items: baseline; gap: 10px; font-size: 10px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; }
  .meta .n { opacity: .45; font-variant-numeric: tabular-nums; }
  .meta .t { font-weight: 800; }
  .meta .c { margin-left: auto; opacity: .45; }

  /* Laptop / big screen only */
  .small-screen { display: none; position: fixed; inset: 0; z-index: 40; background: var(--bg-2);
    align-items: center; justify-content: center; text-align: center; padding: 24px;
    font-size: 13px; letter-spacing: .12em; text-transform: uppercase; line-height: 2; }
  @media (max-width: 1023px), (max-height: 559px) {
    .small-screen { display: flex; }
    #stage, .corner, .dock, .library { display: none; }
  }
</style>
</head>
<body>
  <div class="corner tl brand">
    <svg class="mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
      <path d="M3 16c0-5 4-8 8-8 6 0 8 16 14 16 3 0 4-3 4-8"/><path d="M29 16c0-5-4-8-8-8-6 0-8 16-14 16-3 0-4-3-4-8" opacity=".42"/>
    </svg>
    <span class="words"><span class="wm">Twist Band<sup>®</sup></span><span class="sub">Object Library · FW26</span></span>
  </div>
  <div class="corner tr counter">
    <button class="icon-btn" id="pause" aria-label="Pause spin" aria-pressed="false" title="Pause spin (Space)">
      <svg class="i-pause" width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect x="2" y="1.5" width="2.6" height="9" rx=".8"/><rect x="7.4" y="1.5" width="2.6" height="9" rx=".8"/></svg>
      <svg class="i-play" width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M3 1.8v8.4c0 .5.6.8 1 .5l6.3-4.2a.6.6 0 0 0 0-1L4 1.3c-.4-.3-1 0-1 .5Z"/></svg>
    </button>
  </div>
  <div class="corner bl"><span class="bullet"></span>Drag to spin</div>
  <div class="corner br"><span id="series">Orbit</span>&nbsp;/ FW 2026<span class="bullet"></span></div>

  <div id="stage"></div>

  <div class="dock">
    <button class="nav" id="prev" aria-label="Previous shade" title="Previous shade (↑)">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 2.5 4 6l3.5 3.5"/></svg>
    </button>
    <div class="now">
      <span class="swatch" id="nowSwatch"></span>
      <span class="num" id="nowNum">01</span><span class="of">/ <span id="nowTotal">50</span></span>
      <span class="name" id="nowName">Orbit</span><span class="cat" id="nowCat">Rings</span>
    </div>
    <button class="nav" id="next" aria-label="Next shade" title="Next shade (↓)">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 2.5 8 6 4.5 9.5"/></svg>
    </button>
    <button class="lib-btn" id="openLib" title="Library (L)">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect x="1" y="1" width="4.2" height="4.2" rx="1"/><rect x="6.8" y="1" width="4.2" height="4.2" rx="1"/><rect x="1" y="6.8" width="4.2" height="4.2" rx="1"/><rect x="6.8" y="6.8" width="4.2" height="4.2" rx="1"/></svg>
      Library
    </button>
  </div>

  <div class="library" id="library" role="dialog" aria-modal="true" aria-label="Shade library">
    <div class="lib-head">
      <div class="lib-title">Library<span id="libCount">50 shades</span></div>
      <div class="search" id="searchBox">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search by name, number or category" aria-label="Search shades" autocomplete="off" spellcheck="false" />
        <kbd>/</kbd>
        <button class="clear" id="searchClear" aria-label="Clear search">×</button>
      </div>
      <div class="chips" id="chips"></div>
      <button class="lib-close" id="closeLib">Close · Esc</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="small-screen">Twist Band ®<br />Best viewed on a laptop or larger screen</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // =====================================================================================
  //  Helpers
  // =====================================================================================
  const TAU = Math.PI * 2, PI = Math.PI;
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const wrap = (x) => x - Math.floor(x);                              // 0..1
  const wrapC = (x, n) => ((((x + n / 2) % n) + n) % n) - n / 2;      // centred: -n/2..n/2
  const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
  const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const edgeFade = (u, f = 0.08) => smooth(0, f, u) * smooth(1, 1 - f, u);
  const hash = (i, k = 0) => wrap(Math.sin(i * 12.9898 + k * 78.233) * 43758.5453);

  const rgb = (h) => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
  const hex = (c) => '#' + c.map((v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
  const mix = (a, b, t) => { const A = rgb(a), B = rgb(b); return hex(A.map((v, i) => v + (B[i] - v) * t)); };
  const lum = (h) => { const [r, g, b] = rgb(h); return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255; };
  const withAlpha = (h, a) => { const [r, g, b] = rgb(h); return `rgba(${r},${g},${b},${a})`; };

  // =====================================================================================
  //  Palettes
  // =====================================================================================
  // The first nine are hand-tuned; the rest are derived from four colours by mkPal().
  function mkPal({ bg, ink, accent, accentInk = '#FFFFFF', swatches, photo }) {
    const dark = lum(bg) < 0.35;
    return {
      bg: dark ? [mix(bg, '#FFFFFF', 0.07), bg, mix(bg, '#000000', 0.45)] : [mix(bg, '#FFFFFF', 0.45), bg, mix(bg, '#000000', 0.07)],
      ink, btn: [ink, mix(ink, dark ? '#FFFFFF' : '#000000', 0.35), bg],
      accent, accentInk,
      paper: dark ? [mix(bg, '#FFFFFF', 0.09), mix(bg, '#FFFFFF', 0.04)] : [mix(bg, '#FFFFFF', 0.7), mix(bg, '#FFFFFF', 0.25)],
      paperInk: ink, dot: accent,
      dark: ['#0D0D0F', mix(accent, '#000000', 0.6), dark ? mix(ink, '#000000', 0.25) : mix(bg, '#FFFFFF', 0.3)],
      glass: {
        bg: [mix('#16171B', accent, 0.08), mix('#3A3C44', accent, 0.12)],
        lens: [mix(accent, '#FFFFFF', 0.72), accent, mix(accent, '#000000', 0.45), mix(accent, '#000000', 0.78)],
        spill: rgb(accent).join(','),
      },
      photo: photo || (dark ? 'grayscale(1) contrast(1.15) brightness(.95)' : 'grayscale(1) contrast(1.06) brightness(1.05)'),
      placeholder: mix(bg, ink, 0.08),
      swatches: swatches || [accent, mix(accent, '#FFFFFF', 0.45), ink, mix(bg, ink, 0.15), mix(accent, '#000000', 0.35)],
    };
  }

  const PALETTES = {
    cobalt: {
      bg: ['#F3F3F3', '#E9E9E9', '#DEDEDE'], ink: '#1A1A1A', btn: ['#3A3A3A', '#111111', '#FFFFFF'],
      accent: '#3D4EF2', accentInk: '#FFFFFF', paper: ['#F7F7F5', '#ECECEC'], paperInk: '#151515', dot: '#3D4EF2',
      dark: ['#1B1C20', '#4A4C53', '#E6E6E8'],
      glass: { bg: ['#2B2D35', '#55575F'], lens: ['#B9C7FF', '#3C55F5', '#1424A8', '#0A1260'], spill: '60,85,245' },
      photo: 'grayscale(1) contrast(1.08) brightness(1.06)', placeholder: '#E2E2E2',
    },
    noir: {
      bg: ['#2A2A2E', '#18181B', '#0E0E10'], ink: '#EDEDEB', btn: ['#EDEDEB', '#FFFFFF', '#141414'],
      accent: '#EDEDEA', accentInk: '#141414', paper: ['#26262A', '#1C1C1F'], paperInk: '#EDEDEB', dot: '#9A9AA2',
      dark: ['#050506', '#2C2C31', '#8E8E95'],
      glass: { bg: ['#1A1A1D', '#38383D'], lens: ['#F2F2F2', '#8A8A92', '#3A3A40', '#141416'], spill: '210,210,220' },
      photo: 'grayscale(1) contrast(1.2) brightness(.92)', placeholder: '#2A2A2E',
    },
    lime: {
      bg: ['#F1F4EA', '#E3E8D8', '#D5DCC6'], ink: '#1C2310', btn: ['#2E3A18', '#1C2310', '#F1F4EA'],
      accent: '#A3CC39', accentInk: '#1C2310', paper: ['#F8FAF2', '#E9EEDD'], paperInk: '#1C2310', dot: '#6F9420',
      dark: ['#16200B', '#3E5222', '#DDE6C8'],
      glass: { bg: ['#1F2814', '#46553A'], lens: ['#EAF7C4', '#A3CC39', '#5D7F1A', '#28390A'], spill: '163,204,57' },
      photo: 'grayscale(1) contrast(1.06) brightness(1.06)', placeholder: '#DCE2CF',
    },
    terracotta: {
      bg: ['#F6EFE6', '#ECE2D5', '#E0D3C2'], ink: '#2A1D14', btn: ['#4A3226', '#2A1D14', '#F6EFE6'],
      accent: '#C4572E', accentInk: '#FFF6EE', paper: ['#FBF6EF', '#EFE5D8'], paperInk: '#2A1D14', dot: '#C4572E',
      dark: ['#24170F', '#5C3F2E', '#EADBC8'],
      glass: { bg: ['#2E2119', '#5A463A'], lens: ['#FFE0C2', '#E07A3C', '#9A3E16', '#4A1A06'], spill: '224,122,60' },
      photo: 'grayscale(1) sepia(.38) contrast(1.05) brightness(1.04)', placeholder: '#E6DACB',
    },
    saturn: {
      bg: ['#1B2440', '#111830', '#090D1C'], ink: '#EFE6CF', btn: ['#D9B45A', '#E9C878', '#111830'],
      accent: '#D9B45A', accentInk: '#111830', paper: ['#1D2645', '#151C36'], paperInk: '#EFE6CF', dot: '#D9B45A',
      dark: ['#05070F', '#1E2747', '#C9B98F'],
      glass: { bg: ['#121933', '#2A3356'], lens: ['#FFF1C9', '#D9B45A', '#8A6A1E', '#3A2A06'], spill: '217,180,90' },
      photo: 'grayscale(1) contrast(1.15) brightness(.95)', placeholder: '#1D2645',
    },

      }
      g.fillStyle = '#FFFFFF'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = `300 ${Sm * 0.26}px ${FONT}`; g.letterSpacing = `${-Sm * 0.01}px`;
      g.fillText(item.value, cx - Sm * 0.03, cy);
      const vw = g.measureText(item.value).width;
      g.letterSpacing = '0px'; g.font = `400 ${Sm * 0.07}px ${FONT}`; g.textAlign = 'left';
      g.fillText(item.unit, cx - Sm * 0.03 + vw / 2 + Sm * 0.01, cy - Sm * 0.08);
      g.font = `400 ${Sm * 0.045}px ${FONT}`; g.textBaseline = 'top'; g.fillStyle = 'rgba(255,255,255,0.85)';
      item.top.split('|').forEach((ln, k) => g.fillText(ln, Sm * 0.09, Sm * 0.09 + k * Sm * 0.058));
      g.textBaseline = 'bottom'; g.fillText(item.bottom, Sm * 0.09, H - Sm * 0.09);

    }
    const ctx = c.getContext('2d');
    const w = c.width, h = c.height, S = Math.min(w, h), pad = S * 0.075, small = S * 0.022;
    const a = (al) => withAlpha(T.accentInk, al);
    const p = (al) => withAlpha(T.paperInk, al);
    ctx.save();
    ctx.clearRect(0, 0, w, h);
    ctx.beginPath();
    if (item.poly) {

      // a hair inside the card so neighbouring panels show a fine seam.

      for (let k = 0; k < n; k++) {

    if (item.kind === 'image') {
      const img = images.get(item.src);
      ctx.fillStyle = T.placeholder; ctx.fillRect(0, 0, w, h);
      if (img) {

      }

        g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.42)');
        ctx.fillStyle = g; ctx.fillRect(0, h * 0.55, w, h * 0.45);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = `500 ${S * 0.062}px ${FONT}`;
        ctx.letterSpacing = `${-S * 0.002}px`;
        ctx.fillText(item.title, pad, h - pad);
        ctx.letterSpacing = '0px';
        const r = S * 0.038, cx = w - pad - r, cy = h - pad - S * 0.02;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#000000'; ctx.lineWidth = S * 0.007; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath(); ctx.moveTo(cx - r * 0.42, cy); ctx.lineTo(cx + r * 0.42, cy);
        ctx.moveTo(cx + r * 0.05, cy - r * 0.38); ctx.lineTo(cx + r * 0.45, cy); ctx.lineTo(cx + r * 0.05, cy + r * 0.38); ctx.stroke();
      }

    } else if (item.kind === 'type') {
      ctx.fillStyle = T.accent; ctx.fillRect(0, 0, w, h);
      micro(ctx, 'TYPE SPECIMEN', pad, pad + small, small, a(.75));
      ctx.fillStyle = T.accentInk;
      ctx.font = `400 ${S * 0.47}px ${FONT}`;
      ctx.letterSpacing = `${-S * 0.012}px`;
      ctx.fillText(item.glyph, pad - S * 0.015, h * 0.55);
      ctx.letterSpacing = '0px';
      ctx.fillStyle = a(.6);
      ctx.fillRect(pad, h * 0.63, w - pad * 2, Math.max(1.5, S * 0.002));
      micro(ctx, 'Interstate Grotesk', pad, h * 0.63 + small * 2.2, small, a(.7));
      micro(ctx, 'Regular / Light', pad, h * 0.63 + small * 3.6, small, a(.7));
      ctx.fillStyle = T.accentInk;

    } else if (item.kind === 'number') {
      ctx.fillStyle = T.paper[0]; ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = T.paperInk;
      ctx.font = `400 ${S * 0.52}px ${FONT}`;
      ctx.letterSpacing = `${-S * 0.02}px`;
      ctx.fillText(item.value, pad - S * 0.02, h * 0.64);
      const tw = ctx.measureText(item.value).width;
      ctx.letterSpacing = '0px';
      ctx.fillStyle = T.dot;
      const r = S * 0.058, top = h * 0.64 - S * 0.37;

    } else if (item.kind === 'dots') {
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, T.paper[0]); g.addColorStop(1, T.paper[1]);
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

    } else if (item.kind === 'glass') {

      ctx.beginPath(); ctx.ellipse(cx, cy, R * 0.97, R * 0.89, -0.3, PI * 0.9, PI * 1.7); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.55)';

      const g = item.vert ? ctx.createLinearGradient(0, 0, 0, h) : ctx.createLinearGradient(0, 0, w, 0);

      }

      sg.addColorStop(0, `rgba(0,0,0,${item.shade[0]})`); sg.addColorStop(1, `rgba(0,0,0,${item.shade[1]})`);

  }

  // =====================================================================================
  //  Layouts — 50 shades
  // =====================================================================================
  // A layout places every card each frame. pose(i, o, s, L) writes card i's position (o.p),
  // orientation (o.q) and scale (o.s) for spin/scroll value s.r and time s.t (seconds).
  //   count  cards;  w, h  card size (world);  bend  curve radius (0 = flat); bendOf(i) per card
  //   deck   which faces;  corner  corner radius (share of the short side);  spin  idle speed
  //   view   { elev, azim, dist, roll } — a camera then framed to fit — or { fixed: {pos, target, fov} }
  //   frame  { w, h, drop } share of the screen the formation fills, and a vertical nudge
  //   thumb  { t, r } optional moment for the library thumbnail
  const V3 = THREE.Vector3;
  const AX = new V3(1, 0, 0), AY = new V3(0, 1, 0), AZ = new V3(0, 0, 1);
  const _e = new THREE.Euler(0, 0, 0, 'YXZ'), _q = new THREE.Quaternion(), _q2 = new THREE.Quaternion();
  const _m = new THREE.Matrix4();
  function put(o, x, y, z, rx = 0, ry = 0, rz = 0, s = 1) {

  }
  function yawAll(o, a) { o.p.applyAxisAngle(AY, a); _q.setFromAxisAngle(AY, a); o.q.premultiply(_q); }
  function turnAll(o, q) { o.p.applyQuaternion(q); o.q.premultiply(q); }

  // Twist Tower lies on its side: its upright axis turned to run left to right.
  const TOWER_SIDE = qEuler(0, 0, -PI / 2);

  // The original band and its eight siblings share one ring engine.
  // P.R and P.n change the ring's radius and card count (default 1.6 and 11); P.camDist fixes the camera's distance
  // instead of scaling it with the radius, so a bigger ring also looks bigger.
  function ring(key, label, pal, P) {

    return {
      key, label, cat: 'Rings', pal, deck: 'base', count: n, w, h, bend: R, corner: P.corner, spin: P.spin,
      view: { elev: P.tilt, dist: P.camDist || R * P.dist, roll: P.roll }, frame: { drop: P.drop },
      pose(i, o, s) {
        const a = i * step + s.r;
        const grow = (P.focus || 0) * Math.max(0, Math.cos(a)) ** 6;
        const rr = R * (1 + (i % 3) * 0.006 + grow * 0.3 + (P.breathe || 0) * (0.5 + 0.5 * Math.sin(s.t * 1.5 - a * 2)));
        const y = (P.wave || 0) * h * Math.sin((P.waves || 2) * a) + (i / (n - 1) - 0.5) * (P.helix || 0) * h;
        put(o, rr * Math.sin(a), y, rr * Math.cos(a), (P.lean || 0) * Math.sin(a), a, (P.fan || 0) * Math.sin(2 * a), 1 + grow);
      },
    };
  }

  // Orbit's ribbon: the point at angle f round the ring, v across its height (−½…½). The band rises and falls
  // twice round, swings in and out, and twists about its own length, all rolling slowly with time.
  const ORBIT_STEP = TAU / 11;
  function orbitPoint(f, v, s, L, out) {
    const t = s.t, R = 1.6 * (1 + 0.07 * Math.sin(3 * f - t * 0.5));
    const y = 0.3 * L.h * Math.sin(2 * f - t * 0.8), tw = 0.6 * Math.sin(2 * f + t * 0.6 + 1);
    const sf = Math.sin(f), cf = Math.cos(f), up = v * L.h;
    return out.set(R * sf + up * Math.sin(tw) * sf, y + up * Math.cos(tw), R * cf + up * Math.sin(tw) * cf);
  }

  // Panorama's wall: the point at angle f round you, v across the card's height. It swells in and out, rises and
  // falls, and leans in and out a little, all rolling slowly round.
  function panoPoint(f, v, s, L, out) {
    const t = s.t, R = 3.2 * (1 + 0.045 * Math.sin(4 * f - t * 0.6));
    const y = 0.16 * Math.sin(3 * f + t * 0.5), tw = 0.22 * Math.sin(2 * f - t * 0.4), up = v * L.h;
    return out.set((R + up * Math.sin(tw)) * Math.sin(f), y + up * Math.cos(tw), (R + up * Math.sin(tw)) * Math.cos(f));
  }

  // Lens Grid: an endless grid of square tiles (side, pitch; n × n repeating) panned under a lens that shrinks
  // what is near the centre and swells what is toward the edges, bending every tile's outline as it passes.
  const LG = { n: 7, side: 2.4, pitch: 2.62 };

  function lgPan(s) {

  // Grid position of tile i's centre, wrapped so the grid repeats without end.
  function lgCentre(i, s) {
    const [px, py] = lgPan(s), span = LG.n * LG.pitch, gx = (i % LG.n) * LG.pitch - px, gy = Math.floor(i / LG.n) * LG.pitch - py;
    return [wrap(gx / span + 0.5) * span - span / 2, wrap(gy / span + 0.5) * span - span / 2];
  }
  // The lens: points at distance r from the middle land at r·(m + k·(r/4)²) — small in the middle, big outside.
  // Its strength breathes slowly, like the grid being drawn in and released.
  function lgWarp(x, y, s, out) {

    const f = m + k * r2;

  }

  // Ribbon Flow: the ribbon's centre line as a function of a parameter q (diagonal across the view, dipping away in
  // the middle and swinging close at both ends), measured by length so cards are evenly spaced along it.
  // Toward both ends the line is drawn in toward the viewer (camera at z = 9) so the end cards look 20% bigger —
  // which also carries them 20% further out toward their corners of the screen.
  const rfLine = (q, out) => {

    // Centred on the view and running exactly along its diagonal (x : y = the window's aspect), so the ribbon
    // leaves through the very corners of the screen, bottom-left and top-right.
    return out.set(0.62 * RF_ASPECT * (q - 1), 0.62 * (q - 1), z + (9 - z) * (1 - 1 / 1.2) * e);
  };
  const RF_ASPECT = Math.max(1.2, Math.min(2.6, innerWidth / Math.max(1, innerHeight)));
  const RF = (() => {
    const q0 = -8.5, q1 = 8.5, n = 1200, len = [0], p = new V3(), r = new V3();

    const g = new THREE.PlaneGeometry(1, 1, bend ? 32 : segs, segsY);
    const pos = g.attributes.position, uv = g.attributes.uv;
    const span = bend ? w / bend : 0;
    for (let i = 0; i < pos.count; i++) {
      const u = pos.getX(i);
      if (bend) pos.setXYZ(i, bend * Math.sin(u * span), pos.getY(i) * h, bend * Math.cos(u * span) - bend);
      else pos.setXYZ(i, u * w, pos.getY(i) * h, 0);
      if (flip) uv.setX(i, 1 - uv.getX(i));
    }
    g.computeVertexNormals();
    return g;
  }

  function buildFormation(L, pal, texW, anisotropy) {
    // Keep textures a sensible size even for very thin or very wide cards.
    // texAr: a layout that shows its pictures turned a quarter-turn draws them at the turned shape (height ÷ width).
    const deck = DECKS[L.deck], ar = L.texAr || L.h / L.w, tw = Math.max(64, Math.round(Math.min(texW, 2048 / ar))), texH = Math.max(32, Math.round(tw * ar));
    const faces = deck.map((item) => {
      const canvas = document.createElement('canvas');
      canvas.width = tw; canvas.height = texH;
      const tex = new THREE.CanvasTexture(canvas);
      tex.encoding = THREE.sRGBEncoding;
      tex.anisotropy = anisotropy;
      tex.premultiplyAlpha = true;
      drawCard(item, canvas, pal, L.corner);
      return { item, canvas, tex, mats: [cardMaterial(tex, THREE.FrontSide, L.dissolve, L.tint, L.helix), cardMaterial(tex, THREE.BackSide, L.dissolve, L.tint, L.helix)] };
    });
    const geos = new Map();
    const geoFor = (bend) => {
      const key = bend.toFixed(4);
      if (!geos.has(key)) geos.set(key, [cardGeometry(L.w, L.h, bend, false), cardGeometry(L.w, L.h, bend, true)]);
      return geos.get(key);
    };
    const group = new THREE.Group();
    const holders = [];
    const own = [];
    for (let i = 0; i < L.count; i++) {
      // A deforming shade gets its own finely divided geometry per card, reshaped every frame.
      const [sx, sy] = L.segs || [64, 1];
      const [go, gi] = L.deform ? [cardGeometry(L.w, L.h, 0, false, sx, sy), cardGeometry(L.w, L.h, 0, true, sx, sy)] : geoFor(L.bendOf ? L.bendOf(i) : (L.bend || 0));
      if (L.deform) own.push([go, gi]);
      // A shade may choose each card's face (e.g. one colour per rainbow band); default is round-robin.
      const f = faces[(L.faceOf ? L.faceOf(i) : i) % faces.length];
      const h = new THREE.Object3D();
      // Back face: by default the same picture; a shade may pick another (e.g. flip to reveal a new photo).
      const back = L.backOf ? faces[L.backOf(i) % faces.length] : f;
      h.add(new THREE.Mesh(go, f.mats[0]), new THREE.Mesh(gi, back.mats[1]));
      if (L.deform) h.children.forEach((m) => { m.frustumCulled = false; });
      group.add(h);
      holders.push(h);
    }
    const extra = L.extra ? L.extra(group, L, faces) : null;
    return {
      L, pal, group, holders, faces, tick: extra && extra.tick,
      deform: L.deform && ((i, s) => {
        for (const g of own[i]) {
          const pos = g.attributes.position, n = pos.count, cols = g.parameters.widthSegments + 1, rows = n / cols;
          for (let v = 0; v < n; v++) {
            const uu = (v % cols) / (cols - 1) - 0.5, vv = 0.5 - Math.floor(v / cols) / (rows - 1);
            const q = L.deform(i, s, L, uu, vv);
            if (q.length === 3) pos.setXYZ(v, q[0], q[1], q[2]); else { pos.setX(v, q[0]); pos.setZ(v, q[1]); }
            if (L.deformUV) { const t = L.deformUV(i, s, L, uu, vv); g.attributes.uv.setXY(v, g === own[i][1] ? 1 - t[0] : t[0], t[1]); }
          }
          pos.needsUpdate = true;
          if (L.smoothNormals) g.computeVertexNormals();
          if (L.deformUV) g.attributes.uv.needsUpdate = true;
        }
      }),
      repaint(src) {
        for (const f of faces) if (f.item.src === src) { drawCard(f.item, f.canvas, pal, L.corner); f.tex.needsUpdate = true; }
      },
      dispose() {
        faces.forEach((f) => { f.tex.dispose(); f.mats.forEach((m) => m.dispose()); });
        geos.forEach((pair) => pair.forEach((g) => g.dispose()));
        own.forEach((pair) => pair.forEach((g) => g.dispose()));
        if (extra) extra.dispose();
      },
    };
  }

  const O = { p: new V3(), q: new THREE.Quaternion(), s: 1 };
  // After placing a card, nudge it a hair along its facing (≤0.009) so overlapping cards never
  // share exactly the same plane — the cause of flickering where two cards cross.
  const _bn = new V3();
  function poseCard(L, i, s) {
    O.p.set(0, 0, 0); O.q.identity(); O.s = 1;
    L.pose(i, O, s, L);
    O.p.addScaledVector(_bn.set(0, 0, 1).applyQuaternion(O.q), (i % 4) * 0.003 * O.s);
    return O;
  }

  // Point the camera per the layout's view, then build a frustum that fits the formation —
  // sampled over several moments of its motion so framing stays steady while it moves.
  const _c = new V3(), _corner = [[-0.5, -0.5], [0.5, -0.5], [-0.5, 0.5], [0.5, 0.5], [0, 0.5], [0, -0.5]];
  function frameCamera(cam, root, L, aspect) {
    const v = L.view;
    root.rotation.set(0, 0, v.roll || 0);
    root.updateMatrixWorld();
    cam.up.set(0, 1, 0);
    cam.near = 0.05; cam.far = 200;
    if (v.fixed) {
      cam.position.set(...v.fixed.pos);
      cam.lookAt(...v.fixed.target);
      cam.fov = v.fixed.fov; cam.aspect = aspect;
      cam.updateProjectionMatrix();
      return;
    }
    const az = v.azim || 0;
    cam.position.set(Math.sin(az) * Math.cos(v.elev), Math.sin(v.elev), Math.cos(az) * Math.cos(v.elev)).multiplyScalar(v.dist);
    cam.lookAt(0, 0, 0);
    cam.updateMatrixWorld();
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (let k = 0; k < 12; k++) {
      // Spread the spin samples over several turns so slowly-rotating shades are framed for every angle.
      const s = { t: 0.4 + k * 2.61, r: 0.3 + k * 2.09 };
      for (let i = 0; i < L.count; i++) {
        poseCard(L, i, s);
        if (O.s < 0.05) continue;
        for (const [cx, cy] of _corner) {
          _c.set(cx * L.w, cy * L.h, 0).multiplyScalar(O.s).applyQuaternion(O.q).add(O.p)
            .applyMatrix4(root.matrixWorld).applyMatrix4(cam.matrixWorldInverse);
          if (_c.z > -0.05) continue;
          const rx = _c.x / -_c.z, ry = _c.y / -_c.z;
          minX = Math.min(minX, rx); maxX = Math.max(maxX, rx); minY = Math.min(minY, ry); maxY = Math.max(maxY, ry);
        }
      }
    }
    const F = L.frame || {}, fitW = F.w ?? 0.76, fitH = F.h ?? 0.8, drop = F.drop ?? 0.04;
    let halfW = (maxX - minX) / 2 / fitW, halfH = halfW / aspect;
    if ((maxY - minY) / 2 / halfH > fitH) { halfH = (maxY - minY) / 2 / fitH; halfW = halfH * aspect; }
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2 + halfH * drop, n = cam.near;
    cam.projectionMatrix.makePerspective((cx - halfW) * n, (cx + halfW) * n, (cy + halfH) * n, (cy - halfH) * n, n, cam.far);
    cam.projectionMatrixInverse.copy(cam.projectionMatrix).invert();
  }

  // =====================================================================================
  //  Main scene
  // =====================================================================================
  const stage = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  stage.appendChild(renderer.domElement);
  const ANISO = renderer.capabilities.getMaxAnisotropy();

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 200);
  const root = new THREE.Group();
  scene.add(root);

  let L = LAYOUTS[0], F = null;        // current layout + its built formation
  let enterAt = 0;                     // when the current formation started flying in

  function mount() {
    if (F) { root.remove(F.group); F.dispose(); }
    const built = buildFormation(L, PALETTES[L.pal], L.texW || 800, ANISO);
    F = built;
    // Fetch this shade's photos (if not already cached) and paint each in as it arrives.
    for (const f of built.faces) if (f.item.src) loadImage(f.item.src).then(() => { if (F === built) built.repaint(f.item.src); }, () => {});
    root.add(F.group);
    reframe();
    enterAt = performance.now();
  }
  function reframe() {
    renderer.setSize(innerWidth, innerHeight, false);
    frameCamera(camera, root, L, innerWidth / innerHeight);
  }

  // =====================================================================================
  //  UI: palette, dock, library
  // =====================================================================================
  const $ = (id) => document.getElementById(id);
  const pad2 = (n) => String(n).padStart(2, '0');
  const grid = $('grid'), chips = $('chips'), lib = $('library');
  $('nowTotal').textContent = LAYOUTS.length;
  $('libCount').textContent = `${LAYOUTS.length} shades`;

  function applyChrome() {
    const T = PALETTES[L.pal], r = document.documentElement.style;
    r.setProperty('--bg-1', T.bg[0]); r.setProperty('--bg-2', T.bg[1]); r.setProperty('--bg-3', T.bg[2]);
    r.setProperty('--ink', T.ink);
    r.setProperty('--btn', T.btn[0]); r.setProperty('--btn-hover', T.btn[1]); r.setProperty('--btn-ink', T.btn[2]);
    r.setProperty('--accent', lum(T.accent) > 0.85 || T.accent === T.ink ? T.ink : T.accent);
    $('nowNum').textContent = pad2(L.index + 1);
    $('nowName').textContent = L.label;
    $('nowCat').textContent = L.cat;
    $('nowSwatch').style.background = lum(T.accent) > 0.85 || T.accent === T.ink ? T.ink : T.accent;
    $('series').textContent = L.label;
    for (const t of grid.children) t.setAttribute('aria-current', String(t.dataset.key === L.key));
  }

  let swapTimer, target = null;
  function setLayout(key) {
    const next = BY_KEY[key];
    if (!next || next === (target || L)) return;
    try { localStorage.setItem('twist-band-shade', key); } catch { /* storage unavailable */ }
    history.replaceState(null, '', location.pathname + location.search + '#' + key);
    clearTimeout(swapTimer);
    if (next === L) { target = null; stage.classList.remove('swapping'); return; }
    target = next;
    stage.classList.add('swapping');
    swapTimer = setTimeout(() => {
      L = next; target = null;
      applyChrome();
      velocity = L.spin;
      if (ready) mount();
      stage.classList.remove('swapping');
    }, 220);
  }
  const step = (d) => setLayout(LAYOUTS[(((target || L).index + d) % LAYOUTS.length + LAYOUTS.length) % LAYOUTS.length].key);
  $('prev').addEventListener('click', () => step(-1));
  $('next').addEventListener('click', () => step(1));

  // Library grid
  let filter = 'All';
  for (const c of CATS) {
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.cat = c;
    b.innerHTML = `${c}<b>${c === 'All' ? LAYOUTS.length : LAYOUTS.filter((x) => x.cat === c).length}</b>`;
    b.setAttribute('aria-pressed', String(c === filter));
    b.addEventListener('click', () => {
      filter = c;
      for (const x of chips.children) x.setAttribute('aria-pressed', String(x.dataset.cat === c));
      applyFilter();
    });
    chips.appendChild(b);
  }
  for (const LL of LAYOUTS) {
    const T = PALETTES[LL.pal];
    const t = document.createElement('button');
    t.className = 'tile'; t.dataset.key = LL.key; t.dataset.cat = LL.cat;
    t.innerHTML = `<div class="thumb" style="background:radial-gradient(ellipse at 50% 40%, ${T.bg[0]}, ${T.bg[1]} 60%, ${T.bg[2]})"><div class="shimmer"></div><img alt=""></div>
      <div class="meta"><span class="n">${pad2(LL.index + 1)}</span><span class="t">${LL.label}</span><span class="c">${LL.cat}</span></div>`;
    t.addEventListener('click', () => { setLayout(LL.key); closeLib(); });
    // What the search matches: the name, the number (with or without its leading zero), the category and the key.
    t.dataset.find = `${LL.label} ${pad2(LL.index + 1)} ${LL.index + 1} ${LL.cat} ${LL.key}`.toLowerCase();
    grid.appendChild(t);
  }
  // Search: narrows the grid as you type — combined with the category chip — and every word must match somewhere.
  const search = $('search'), searchBox = $('searchBox'), noResults = document.createElement('div');
  noResults.className = 'no-results'; noResults.hidden = true; grid.appendChild(noResults);
  function applyFilter() {
    const words = search.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
    let shown = 0;
    for (const t of grid.children) {
      if (t === noResults) continue;
      const ok = (filter === 'All' || t.dataset.cat === filter) && words.every((w) => t.dataset.find.includes(w));
      t.hidden = !ok; if (ok) shown++;
    }
    searchBox.classList.toggle('has-text', search.value.length > 0);
    noResults.hidden = shown > 0; noResults.innerHTML = `Nothing matches “${search.value.trim().replace(/[<>&]/g, '')}”<small>Try a name, a number or a category</small>`;
    // Each chip shows how many shades in its category match the search.
    for (const ch of chips.children) {
      const c = ch.dataset.cat, n = [...grid.children].filter((t) => t !== noResults && (c === 'All' || t.dataset.cat === c) && words.every((w) => t.dataset.find.includes(w))).length;
      ch.querySelector('b').textContent = n; ch.classList.toggle('empty', n === 0);
    }
    $('libCount').textContent = words.length || filter !== 'All' ? `${shown} of ${LAYOUTS.length} shades` : `${LAYOUTS.length} shades`;
  }
  search.addEventListener('input', applyFilter);
  // Enter opens the first match.
  search.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { const first = [...grid.children].find((t) => t !== noResults && !t.hidden); if (first) first.click(); }
  });
  $('searchClear').addEventListener('click', () => { search.value = ''; applyFilter(); search.focus(); });
  let libOpen = false;
  function openLib() {
    libOpen = true; lib.classList.add('open'); document.body.classList.add('lib-open');
    grid.querySelector(`[data-key="${(target || L).key}"]`)?.scrollIntoView({ block: 'center' });
    setTimeout(() => search.focus({ preventScroll: true }), 60);
    generateThumbs();
  }
  function closeLib() { libOpen = false; lib.classList.remove('open'); document.body.classList.remove('lib-open'); }
  $('openLib').addEventListener('click', openLib);
  $('closeLib').addEventListener('click', closeLib);

  // ---- Thumbnails: each shade rendered once, off-screen, at a moment mid-motion ----
  const thumbs = new Map();
  let thumbRenderer = null, thumbBusy = false;
  async function generateThumbs() {
    if (thumbBusy) return;
    thumbBusy = true;
    await Promise.race([Promise.allSettled(ALL_SRCS.map(loadImage)), new Promise((r) => setTimeout(r, 6000))]);
    if (!thumbRenderer) {
      thumbRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      thumbRenderer.setPixelRatio(1);
      thumbRenderer.setSize(480, 300, false);
      thumbRenderer.outputEncoding = THREE.sRGBEncoding;
    }
    const tScene = new THREE.Scene(), tRoot = new THREE.Group(), tCam = new THREE.PerspectiveCamera(40, 1.6, 0.05, 200);
    tScene.add(tRoot);
    const out = document.createElement('canvas');
    out.width = 480; out.height = 300;
    const octx = out.getContext('2d');
    const order = [...LAYOUTS].sort((a, b) => (a === L ? -1 : b === L ? 1 : a.index - b.index));
    for (const LL of order) {
      if (thumbs.has(LL.key)) continue;
      // One shade going wrong must never stop the rest: each preview is made on its own, and a failure just skips it.
      try {
      const T = PALETTES[LL.pal];
      const srcs = [...new Set(DECKS[LL.deck].filter((d) => d.src).map((d) => d.src))];
      await Promise.race([Promise.allSettled(srcs.map(loadImage)), new Promise((r) => setTimeout(r, 2500))]);
      const f = buildFormation(LL, T, Math.min(320, LL.texW || 320), 4);
      tRoot.add(f.group);
      frameCamera(tCam, tRoot, LL, 1.6);
      const s = { t: LL.thumb?.t ?? 2.2, r: LL.thumb?.r ?? 0.55 };
      f.holders.forEach((h, i) => {
        poseCard(LL, i, s);
        h.position.copy(O.p); h.quaternion.copy(O.q); h.scale.setScalar(Math.max(O.s, 1e-4)); h.visible = O.s > 0.002;
        if (f.deform) f.deform(i, s);
      });
      if (f.tick) f.tick(s, 1.6);
      thumbRenderer.render(tScene, tCam);
      const g = octx.createRadialGradient(240, 120, 0, 240, 150, 300);
      g.addColorStop(0, T.bg[0]); g.addColorStop(0.6, T.bg[1]); g.addColorStop(1, T.bg[2]);
      octx.fillStyle = g; octx.fillRect(0, 0, 480, 300);
      octx.drawImage(thumbRenderer.domElement, 0, 0, 480, 300);
      const url = out.toDataURL('image/jpeg', 0.86);
      thumbs.set(LL.key, url);
      tRoot.remove(f.group); f.dispose();
      const img = grid.querySelector(`[data-key="${LL.key}"] img`);
      img.onload = () => { img.classList.add('loaded'); img.previousElementSibling?.remove(); };
      img.src = url;
      } catch (err) {
        console.warn('Preview skipped for', LL.key, err);
        thumbs.set(LL.key, null);
        while (tRoot.children.length) tRoot.remove(tRoot.children[0]);
      }
      await new Promise((r) => setTimeout(r, 0));
    }
    thumbBusy = false;
  }

  // =====================================================================================
  //  Motion
  // =====================================================================================
  const MAX_SPIN = 3.2, FRICTION = 2.0, DRAG_GAIN = 1.0;
  let rotation = 0, velocity = 0, paused = false, ready = false;
  let dragging = false, dragStart = 0, startX = 0, lastX = 0, lastT = 0, vx = 0;
  let prev = performance.now();
  const smallScreen = matchMedia('(max-width: 1023px), (max-height: 559px)');
  const pxPerRadian = () => innerWidth * 0.32;
  const clampSpin = (v) => Math.max(-MAX_SPIN, Math.min(MAX_SPIN, v));
  const S = { t: 0, r: 0 };

  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min((now - prev) / 1000, 0.05);
    prev = now;
    if (!ready || smallScreen.matches || libOpen) return;

    if (!dragging) {
      velocity += ((paused ? 0 : L.spin) - velocity) * Math.min(1, FRICTION * dt);
      velocity = clampSpin(velocity);
      rotation += velocity * dt;
      if (Math.abs(rotation) > TAU * 64) { rotation %= TAU; dragStart = rotation; }
    }
    if (!paused) S.t += dt;
    S.r = rotation;

    // Cards fly in, swirling into place one after another, when a shade appears (unless the shade has its own entrance).
    const since = (now - enterAt) / 1000, n = L.count;
    if (F.tick) F.tick(S, innerWidth / innerHeight);
    F.holders.forEach((h, i) => {
      poseCard(L, i, S);
      const e = L.ownEntrance ? 1 : ease(since * 1.7 - (i / n) * 0.7);
      if (e < 1) {
        O.s *= e;
        O.p.multiplyScalar(0.55 + 0.45 * e);
        O.q.premultiply(_q.setFromAxisAngle(AY, (1 - e) * 1.1));
      }
      h.position.copy(O.p); h.quaternion.copy(O.q);
      h.scale.setScalar(Math.max(O.s, 1e-4));
      h.visible = O.s > 0.002;
      if (F.deform && h.visible) F.deform(i, S);
    });
    renderer.render(scene, camera);
  }

  stage.addEventListener('pointerdown', (e) => {
    dragging = true;
    stage.classList.add('dragging');
    stage.setPointerCapture(e.pointerId);
    dragStart = rotation; startX = lastX = e.clientX; lastT = performance.now(); vx = 0;
  });
  stage.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const now = performance.now();
    vx = (e.clientX - lastX) / Math.max(1, now - lastT);
    lastX = e.clientX; lastT = now;
    rotation = dragStart + ((e.clientX - startX) / pxPerRadian()) * DRAG_GAIN;
  });
  const endDrag = () => {
    if (!dragging) return;
    dragging = false;
    stage.classList.remove('dragging');
    if (performance.now() - lastT > 80) vx = 0;
    velocity = clampSpin(((vx * 1000) / pxPerRadian()) * DRAG_GAIN);
  };
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    velocity = clampSpin(velocity - (d / pxPerRadian()) * 0.9);
  }, { passive: false });

  const pauseBtn = $('pause');
  function togglePause() {
    paused = !paused;
    pauseBtn.setAttribute('aria-pressed', String(paused));
    pauseBtn.setAttribute('aria-label', paused ? 'Resume spin' : 'Pause spin');
    pauseBtn.title = paused ? 'Resume spin (Space)' : 'Pause spin (Space)';
  }
  pauseBtn.addEventListener('click', togglePause);

  addEventListener('keydown', (e) => {
    // While typing in the search box, keys type; Escape clears the search first, then closes the library.
    if (e.target === search) { if (e.key === 'Escape') { if (search.value) { search.value = ''; applyFilter(); } else closeLib(); } return; }
    if (e.key === '/' && libOpen) { search.focus(); e.preventDefault(); return; }
    if (e.key === 'Escape' && libOpen) return closeLib();
    if (e.key === 'l' || e.key === 'L') return libOpen ? closeLib() : openLib();
    if (libOpen) return;
    if (e.key === 'ArrowLeft') velocity = clampSpin(velocity - 0.6);
    if (e.key === 'ArrowRight') velocity = clampSpin(velocity + 0.6);
    if (e.key === 'ArrowUp') { step(-1); e.preventDefault(); }
    if (e.key === 'ArrowDown') { step(1); e.preventDefault(); }
    if (e.key === ' ') { togglePause(); e.preventDefault(); }
  });
  addEventListener('resize', () => { if (ready) reframe(); });

  // =====================================================================================
  //  Start
  // =====================================================================================
  function initialKey() {
    const h = location.hash.slice(1);
    if (BY_KEY[h]) return h;
    try { const saved = localStorage.getItem('twist-band-shade'); if (BY_KEY[saved]) return saved; } catch { /* storage unavailable */ }
    return LAYOUTS[0].key;
  }
  L = BY_KEY[initialKey()];
  velocity = L.spin;
  applyChrome();
  (async () => {
    await Promise.all([document.fonts.load('400 100px Inter'), document.fonts.load('500 20px Inter'), document.fonts.load('800 100px Inter')]);
    mount();
    ready = true;
    stage.classList.add('ready');
    // Photos fill in as they arrive (and stay cached for every shade).
    for (const src of ALL_SRCS) loadImage(src).then(() => F && F.repaint(src), () => {});
  })();
  requestAnimationFrame(frame);
</script>
</body>
</html>
